<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia da semana</title>
</head>
<body>
    <div id="res"></div>
    <script>
        let res = document.getElementById('res')
        var agora = new Date()
        var diaSemana = agora.getDay()

        switch (diaSemana) {
            case 0: 
                res.innerHTML = 'Hoje é Domingo'
                break
            case 1:
                res.innerHTML = 'Hoje é Segunda-Feira'
                break
            case 2:
                res.innerHTML = 'Hoje é Terça-Feira'
                break
            case 3:
                res.innerHTML = 'Hoje é Quarta-Feira'
                break
            case 4:
                res.innerHTML = 'Hoje é Quinta-Feira'
                break
            case 5:
                res.innerHTML = 'Hoje é Sexta-Feira'
                break
            case 6:
                res.innerHTML = 'Hoje é Sábado'
                break
            default:
                res.innerHTML = '[ERRO] Dia inválido!'
                break
        }
    </script>
</body>
</html>
