<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de velocidade</title>
    <style>
      body {
        background-color: linear-gradient(180deg, #2c3e50, #000000);
        font: normal 16pt Arial, sans-serif;
        display: flex;
        justify-content: center;
        
      }
    </style>
</head>
<body>
    <p>Você está dirigindo e tem um radar móvel a sua frente, qual velocidade você passaria?</p>
    <input type="number" name="numbvel" id="numbvel" placeholder="Digite uma velocidade...">
    <input type="button" value="Enter" onclick="enter()">

    <p id="velocidade">Radar de velocidade: </p>
    <p id="mensagem"></p>
    <script>
        function enter() {
          let numbvel = document.getElementById('numbvel')
          let valorvel = Number(numbvel.value)
          let vel = document.getElementById('velocidade')
          let msg = document.getElementById('mensagem')

          vel.innerHTML = `Radar de velocidade: ${valorvel} km/h`

          if (valorvel > 60) {
            msg.innerHTML = ('Você ultrapassou o limite de velocidade!')
          } else {
            msg.innerHTML = ('Boa viagem! Dirija com cuidado.')
          }
          }
    </script>
</body> 
</html>
