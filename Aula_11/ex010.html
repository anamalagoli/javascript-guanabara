<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de multas</title>
    <style>
        body {
            font: normal 14px Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #494444;
        }

        .container {
            background-color: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 500px;
        }

        h1 {
            color: #fff;
        }

        p {
            font-size: 18px;
        }

        input {
            padding: 5px;
            border-radius: 5px;
            border: none;
            margin-top: 10px;
            font-size: 16px;
        }

        input[type="button"] {
            margin-left: 5px;
            cursor: pointer;
            background-color: #574e53;
            color: #fff;
        }

        input[type="button"]:hover {
            background: #5f555a;
        }

        .multa {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">

    <h1>Sistema de multas</h1>

    <p>Velocidade do carro: 
    
    <input type="number" name="txtvel" id="txtvel" placeholder="Digite aqui..."> Km/h 

    <input type="button" value="Verificar" onclick="calcular()"> </p>

    <div id="res"></div>

    </div>
    <script>
        function calcular() {
            let txtv = document.getElementById('txtvel')
            let res = document.getElementById('res')
            let vel = Number(txtv.value)
            res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel} km/h</strong></p>`
            if (vel > 60) {
                res.innerHTML += `<p>Você está <strong class="multa">MULTADO</strong> por excesso de velocidade!`
            }
            res.innerHTML += `<p>Dirija sempre com cinto de segurança!</p>`
      }
    </script>
</body>
</html>
