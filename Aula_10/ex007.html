<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando valores</title>
    <style>
        body {
            background-color: rgb(222, 189, 253);
            color: white;
            font: normal 18pt Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            height: 100vh;
        }

        .container {
            background: #836fff;
            padding: 2px;
            border-radius: 15px;
            text-align: center;
            width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2)
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        .inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            text-align: center;
        }

        input[type="button"] {
            width: 80px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #00c9a7;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background: #00a98b;
        }

        #res {
            margin-top: 1.5rem;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .resultado {
            color: #00ffcc;
            font-size: 18pt;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Somando valores</h1>

        <div class="inputs">
            <input type="number" name="txtn1" id="txtn1">
            <span>+</span>
            <input type="number" name="txtn2" id="txtn2">
            <input type="button" value="Somar" onclick="somar()">
        </div>
        
        <div id="res">Resultado:</div>
    </div>
    <script>
        function somar() {
            var tn1 = document.getElementById('txtn1')
            var tn2 = document.getElementById('txtn2')
            var res = document.getElementById('res')
            
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var s = n1 + n2
            res.innerHTML = `Resultado: ${n1} + ${n2} = <span class="resultado">${s}</span>`
        }
    </script>
</body>
</html>
